<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#95CCDE" />
    <meta name="description" content="Educancer: edukasi kanker terintegrasi dari RSUD Provinsi NTB dan PKRS. Materi, video, kuis, dan konsultasi dalam satu aplikasi." />
    <meta property="og:title" content="Educancer: Edukasi Kanker untuk Semua" />
    <meta property="og:description" content="Materi, video, kuis, dan konsultasi dari tim RSUD Provinsi NTB." />
    <meta property="og:image" content="/images/bg-rsud.webp" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Educancer: Edukasi Kanker Terintegrasi</title>
    <script>
      // Pasang tema sebelum render pertama agar tidak berkedip.
      try {
        var t = localStorage.getItem('educancer:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
